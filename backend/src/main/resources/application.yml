server:
  port: 8080

spring:
  application:
    name: wisdom-farm
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:fanclub}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.wisdom.farm.entity

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

wisdom:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-at-least-32-bytes}
    expire-minutes: ${JWT_EXPIRE_MINUTES:10080}
  wechat:
    appid: ${WECHAT_APPID:}
    secret: ${WECHAT_SECRET:}
  wechat-pay:
    mch-id: ${WECHAT_PAY_MCH_ID:}
    appid: ${WECHAT_PAY_APPID:${WECHAT_APPID:}}
    merchant-serial-no: ${WECHAT_PAY_SERIAL_NO:}
    private-key-path: ${WECHAT_PAY_PRIVATE_KEY_PATH:}
    private-key: ${WECHAT_PAY_PRIVATE_KEY:}
    api-v3-key: ${WECHAT_PAY_API_V3_KEY:}
    platform-public-key-path: ${WECHAT_PAY_PLATFORM_PUBLIC_KEY_PATH:}
    notify-url: ${WECHAT_PAY_NOTIFY_URL:}
